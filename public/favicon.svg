<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zenith Tabletop 3D">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2418"/>
      <stop offset="1" stop-color="#26100a"/>
    </linearGradient>
    <linearGradient id="kaya" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c286"/>
      <stop offset="1" stop-color="#cf9c5c"/>
    </linearGradient>
    <radialGradient id="black" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5b5b5b"/>
      <stop offset="0.45" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="white" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1ecdf"/>
      <stop offset="1" stop-color="#cfc6b4"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rosewood case with a thin brass rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#case)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="#c9a04a" stroke-width="1.2" opacity="0.9"/>

  <!-- kaya board -->
  <rect x="12" y="12" width="40" height="40" rx="3" fill="url(#kaya)" filter="url(#shadow)"/>
  <g stroke="#5a3a1c" stroke-width="1" stroke-linecap="round" opacity="0.85">
    <line x1="22" y1="16" x2="22" y2="48"/>
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="42" y1="16" x2="42" y2="48"/>
    <line x1="16" y1="22" x2="48" y2="22"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="16" y1="42" x2="48" y2="42"/>
  </g>
  <circle cx="32" cy="32" r="1.1" fill="#5a3a1c"/>

  <!-- stones -->
  <circle cx="22" cy="22" r="5.6" fill="url(#black)" filter="url(#shadow)"/>
  <circle cx="42" cy="42" r="5.6" fill="url(#white)" filter="url(#shadow)"/>
  <circle cx="32" cy="22" r="5.6" fill="url(#black)" filter="url(#shadow)"/>

  <!-- vermilion seal -->
  <rect x="41" y="14.5" width="8" height="8" rx="1" fill="#b3141c" opacity="0.95"/>
  <path d="M43 16.5h4M45 16.5v4M43.5 20.5h3" stroke="#f6e7d2" stroke-width="0.9" stroke-linecap="round" fill="none"/>
</svg>
