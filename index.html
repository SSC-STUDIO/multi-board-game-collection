<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14100c" />
    <meta name="description" content="Zenith-Tabletop-3D · 全实体化、无弹窗的 3D 拟真棋道空间" />
    <title>Zenith-Tabletop-3D · 巅峰 3D 拟真棋道空间</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/ui/start-screen.css" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <link rel="stylesheet" href="/src/ui/importer.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14100c;
      }
      /* The one and only DOM element during play: every interaction lives inside the WebGL world. */
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        cursor: default;
      }
      /* Ink-drop placeholder while fonts and the asset manifest load; removed by main.js on boot. */
      #boot {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: #b3141c;
        box-shadow: 0 0 0 0 rgba(179, 20, 28, 0.55);
        animation: boot-ripple 1.4s ease-out infinite;
      }
      @keyframes boot-ripple {
        0% { box-shadow: 0 0 0 0 rgba(179, 20, 28, 0.55); }
        100% { box-shadow: 0 0 0 26px rgba(179, 20, 28, 0); }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="webgl" aria-label="Zenith Tabletop 3D" tabindex="0"></canvas>
    <div id="boot" aria-hidden="true"></div>
  </body>
</html>
