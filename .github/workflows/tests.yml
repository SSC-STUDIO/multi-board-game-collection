name: Zenith checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run test:features
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenith-browser-evidence
          path: |
            _tmp_smoke/*.png
            _tmp_production/*.png
          if-no-files-found: ignore
