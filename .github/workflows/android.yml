name: Android APK checks
on:
  push:
    branches: [master]
    paths: ['src/**', 'public/**', 'android/**', 'capacitor.config.json', 'package*.json', 'vite.config.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'android/**', 'capacitor.config.json', 'package*.json', 'vite.config.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Zenith-Tabletop-3D-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-*.html
